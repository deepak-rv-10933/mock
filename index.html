<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlassOps — Executive Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0b1020;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.07);
  --text:#eff5ff; --ink:#eff5ff; --muted:#aebbd4; --ink2:#aebbd4; --soft:#7f8da9; --ink3:#7f8da9;
  --blue:#72a5ff; --blue2:#4f7cff; --violet:#8b7bff; --cyan:#69d7ff;
  --green:#3ad59f; --green-soft:rgba(58,213,159,.15);
  --orange:#ffbc5c; --orange-soft:rgba(255,188,92,.15);
  --red:#ff6d7f; --red-soft:rgba(255,109,127,.14);
  --blue-soft:rgba(79,124,255,.18);
  --panel:rgba(255,255,255,.06);
  --panel2:rgba(255,255,255,.08);
  --shadow:0 20px 60px rgba(0,0,0,.32);
  --sidebar:238px; --agent:392px;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(91,129,255,.20), transparent 26%),
    radial-gradient(circle at 85% 12%, rgba(70,214,255,.15), transparent 22%),
    linear-gradient(180deg,#0b1020 0%,#0f1730 48%,#0b1020 100%);
  background-attachment:fixed;font-size:14px;line-height:1.6;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:rgba(8,12,25,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--blue2));display:grid;place-items:center;font-weight:800;color:#fff}
.logo .lt{font-size:15px;font-weight:800}
.logo .ls{font-size:12px;color:var(--muted)}
.topmeta{display:flex;align-items:center;gap:12px;margin-left:auto;color:var(--muted);font-size:12px}
.pulse{width:10px;height:10px;border-radius:999px;background:var(--green);box-shadow:0 0 10px 1px rgba(58,213,159,.7)}
.user{width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;font-weight:700}

/* layout */
.layout{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:calc(100vh - 68px)}
.side{padding:16px 12px 24px;border-right:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}
.side .sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:800;padding:14px 12px 8px}
.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;color:var(--muted);text-decoration:none;margin-bottom:5px;border:1px solid transparent;font-weight:600;font-size:13.5px}
.side a.on{background:linear-gradient(135deg,rgba(113,165,255,.18),rgba(139,123,255,.12));color:#fff;border-color:rgba(126,161,255,.28)}
.side a:hover{background:rgba(255,255,255,.05)}
.side a.dead{opacity:.5;cursor:default}
.side a.dead:hover{background:transparent}
.side .av2{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:10px;font-weight:800;flex:0 0 24px}
.side a.on .av2{background:linear-gradient(135deg,var(--violet),var(--blue2));color:#fff}
.side .ic{width:16px;height:16px;border-radius:5px;background:var(--soft);opacity:.5}
.side .badge{margin-left:auto;background:var(--orange-soft);color:var(--orange);padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;font-family:'IBM Plex Mono'}
.side .badge.ok{background:var(--green-soft);color:var(--green)}

/* content-wrap: main + agent as its OWN column (no overlap) */
.content-wrap{min-width:0;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) var(--agent);gap:18px;align-items:start}
.main{min-width:0}

/* hero */
.hero{background:linear-gradient(135deg,rgba(110,130,255,.16),rgba(105,215,255,.09));border:1px solid var(--line);border-radius:26px;padding:22px 22px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.crumb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#d2dcf3;font-weight:800;margin-bottom:10px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.head h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.03em}
.head .sub{color:var(--muted);font-size:13px;margin-top:5px;max-width:52ch}
.hero-right{display:grid;grid-template-columns:repeat(2,minmax(118px,1fr));gap:10px;min-width:260px}
.mini-stat{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:11px 13px}
.mini-stat .l{font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.mini-stat .v{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.banner{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:14px 16px;background:rgba(8,16,36,.35);border:1px solid var(--line);border-radius:18px}
.banner .tag{flex:0 0 auto;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#09111f;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;padding:5px 10px;border-radius:999px;height:fit-content}
.banner b{display:block;font-size:15.5px;margin-bottom:3px;color:#fff;line-height:1.3}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi.risk{border-color:rgba(255,109,127,.4);background:linear-gradient(135deg,rgba(255,109,127,.12),var(--panel))}
.kpi .l{font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.kpi .v{font-size:28px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px}
.kpi.risk .v{color:var(--red)}
.kpi .d{color:var(--muted);font-size:12px}
.up{color:var(--green)} .dn{color:var(--red)} .fl{color:var(--soft)} .warn{color:var(--orange)}

/* cards + section labels */
.seclabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:800;margin:4px 2px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1150px){.grid2{grid-template-columns:1fr}}
.card,.foldcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card.focus{border-color:rgba(255,109,127,.4)}
.card h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.25;display:flex;align-items:center;gap:8px}
.card h2 .src,.foldcard>summary .src{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--soft);font-family:'IBM Plex Mono'}
.card .sub{font-size:12.5px;color:var(--muted);margin:4px 0 14px;line-height:1.45}

/* fold cards */
.foldcard>summary{list-style:none;cursor:pointer;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.3;display:flex;align-items:center;gap:8px}
.foldcard>summary::-webkit-details-marker{display:none}
.foldcard>summary::after{content:'▸';font-size:12px;color:var(--soft);flex:0 0 auto;margin-left:10px}
.foldcard[open]>summary::after{content:'▾'}
.foldcard .sub{font-size:12.5px;color:var(--muted);line-height:1.45}
.foldcard table{margin-top:14px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.5;margin-top:6px}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;text-align:left;color:var(--soft);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line)}
th.qty,td.qty{text-align:right}
td{padding:11px 10px;border-bottom:1px solid var(--line2);color:#d7e3f7;vertical-align:top;line-height:1.5}
td b{color:#fff;font-weight:700}
td.n{font-family:'IBM Plex Mono';font-size:12.5px;font-variant-numeric:tabular-nums}
td.note{max-width:300px}
.cd{display:block;color:var(--soft);font-size:12px;line-height:1.4;margin-top:2px;font-weight:400;font-family:'Manrope',sans-serif}
.status{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.status .cap{font-size:11px;color:var(--soft)}
tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
tr.critical td{background:rgba(255,109,127,.10)}
tr.critical td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr:hover td{background:rgba(255,255,255,.03)}
tr.critical:hover td{background:rgba(255,109,127,.16)}

/* pills */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.pg{background:var(--green-soft);color:var(--green)}
.po{background:var(--orange-soft);color:var(--orange)}
.pr{background:var(--red-soft);color:var(--red)}
.pb{background:var(--blue-soft);color:var(--blue)}

/* ===== agent (own column, becomes overlay on small screens) ===== */
.agent{min-width:0;position:sticky;top:20px;max-height:calc(100vh - 40px);background:var(--panel);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.ahead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.03)}
.zicon{width:36px;height:36px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--blue2));display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 36px}
.atitle{font-size:16px;font-weight:800}
.asub{font-size:11.5px;color:var(--muted)}
.chip{margin-left:auto;background:var(--orange-soft);color:var(--orange);padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800}
.closeX{display:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);width:32px;height:32px;border-radius:11px;place-items:center;font-size:18px;margin-left:8px}
.abody{padding:15px 16px;overflow:auto;flex:1}
.seclabel2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:800;margin:2px 0 10px}
.seclabel2.mt{margin-top:16px}
.allclear{color:var(--muted);font-size:12.5px;padding:6px 2px 10px}

/* action cards */
.action{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px}
.action.done{border-color:rgba(58,213,159,.4);background:linear-gradient(135deg,rgba(58,213,159,.10),var(--panel2))}
.arow{display:flex;gap:12px;align-items:flex-start}
.anum{width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-weight:800;color:#07111d;flex:0 0 30px}
.action.done .anum{background:linear-gradient(135deg,#5ee3b4,var(--green));color:#06231a}
.abody2{min-width:0}
.abody2 b{display:block;font-size:14px;line-height:1.35;color:#fff}
.abody2 span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.dbtns{display:flex;gap:8px;margin-top:11px}
.mini{flex:1;font-size:12px;font-weight:800;border-radius:12px;padding:8px 10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)}
.mini:hover{border-color:var(--blue);color:#fff}
.mini.ok{flex:1.3;background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#08101d}
.mini.ok:hover{filter:brightness(1.06)}
.mini.ok:disabled{background:linear-gradient(135deg,#5ee3b4,var(--green));color:#06231a;cursor:default}

/* detail (why-chain) */
.detail{margin:12px 0;border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(8,15,32,.3)}
.detail:empty{display:none}
.dt{font-size:13.5px;font-weight:800;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#fff}
.sev{font-size:9.5px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;font-weight:800;text-transform:uppercase}
.sev.r{background:var(--red-soft);color:var(--red)} .sev.a{background:var(--orange-soft);color:var(--orange)} .sev.g{background:var(--green-soft);color:var(--green)}
.cstep{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.cnum{width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:0 0 22px;font-family:'IBM Plex Mono';margin-top:1px}
.cstep.root .cnum{background:var(--red-soft);color:var(--red);font-weight:800}
.ct{font-size:13px;color:#d7e3f7;line-height:1.5}
.ct b{display:block;font-size:10.5px;color:var(--cyan);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px;font-weight:800}
.cstep.root .ct b{color:var(--red)}
.carr{margin:2px 0 6px 10px;color:var(--soft);font-size:11px;border-left:2px dotted var(--line);padding:2px 0 2px 14px}
.cite{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono';font-size:11px;padding:2px 7px;border-radius:8px;margin:6px 4px 0 0}
.ift{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.ift div{border:1px solid var(--line);border-radius:13px;padding:11px;font-size:12px;line-height:1.45}
.ift .yes{background:rgba(58,213,159,.09)}
.ift .no{background:rgba(255,109,127,.09)}
.ift b{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.ift .yes b{color:var(--green)} .ift .no b{color:var(--red)}
.act{width:100%;margin-top:12px;border:none;border-radius:13px;padding:11px 14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#08101d;font-weight:800}
.act.done{background:linear-gradient(135deg,#5ee3b4,var(--green));color:#06231a}

/* being handled + handled */
.statusline{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:13px;padding:9px 11px;margin-bottom:8px;display:flex;gap:9px;align-items:center}
.handled{border-top:1px solid var(--line2);margin-top:12px;padding-top:12px}
.handled summary{font-size:11.5px;color:var(--soft);cursor:pointer;font-weight:800;letter-spacing:.04em}
.hitem{display:flex;gap:8px;font-size:12px;color:var(--muted);padding:6px 0 0 2px}
.hitem .ok{color:var(--green);flex:0 0 auto}

/* ask */
.ask{border-top:1px solid var(--line2);padding:15px 16px;background:rgba(255,255,255,.03)}
.askrow{display:flex;gap:10px}
.askrow input{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:11px 13px;outline:none}
.askrow input::placeholder{color:var(--soft)}
.askrow input:focus{border-color:var(--blue)}
.askrow button{border:none;border-radius:13px;background:#f4f7ff;color:#111a2c;padding:0 16px;font-weight:800}
.hint{font-size:11px;color:var(--soft);margin-top:9px;line-height:1.8}
.hint b{color:var(--muted);cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:var(--line)}

/* toggle + overlay (small screens) */
.agent-toggle{display:none}
.agent-overlay{display:none}
@media(max-width:1150px){
  .content-wrap{grid-template-columns:1fr}
  .content-wrap>.agent{display:none}
  .agent-toggle{display:flex;align-items:center;gap:8px;position:fixed;right:18px;bottom:18px;z-index:60;border:none;border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#08101d;font-weight:800;box-shadow:0 12px 30px rgba(79,124,255,.45)}
  .agent-overlay.open{display:flex;position:fixed;inset:0;z-index:70;background:rgba(3,6,16,.62);backdrop-filter:blur(8px);padding:16px;align-items:stretch;justify-content:flex-end}
  .agent-overlay>.agent{display:flex;position:relative;top:0;max-height:100%;width:min(430px,100%)}
  .agent-overlay>.agent .closeX{display:grid}
}
@media(max-width:960px){.content-wrap{padding:14px}.head h1{font-size:24px}.top{padding:12px 16px}}
@media(max-width:640px){
  .hero-right,.ift{grid-template-columns:1fr}
  .hero,.card,.foldcard,.agent{border-radius:18px}
  .banner{flex-direction:column}
  .agent-overlay.open{padding:10px}
  .agent-overlay>.agent{width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><div class="mark">G</div><div><div class="lt">GlassOps</div><div class="ls">Executive control center</div></div></div>
  <div class="topmeta"><span class="pulse"></span><span>Zia scanned 6,204 records across CRM, Creator &amp; Desk at 06:04</span><div class="user" id="av">BD</div></div>
</header>

<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="content-wrap" id="contentWrap">
    <main class="main" id="main"></main>
    <aside class="agent" id="agent"></aside>
  </div>
</div>

<button class="agent-toggle" id="openAgent" onclick="openPanel()">💬 Ask Zia <span id="togCount"></span></button>
<div class="agent-overlay" id="agentOverlay" onclick="if(event.target===this)closePanel()"></div>

<script>
/* ================= live-data config =================
   The dashboard loads its data from the Catalyst API (GET /api/board?role=<role>).
   Set it to a full origin to point the client at a remote backend. Here it points
   at the GlassOps Board API (Catalyst AppSail), which reads the agent's decisions
   from the Data Store table `agent_decisions` and serves GET /api/board?role=. */
const API_BASE = 'https://glassops.development.catalystappsail.in';
const ALL_ROLES = ['board','nsales','snorth','ssouth','swest','seast','sexp','ppune','pchn','proc'];
function sevFromSeverity(sev){
  if(!sev) return null;
  return ({urgent:'r',attention:'a',healthy:'g',good_news:'g'})[sev] || null;
}

/* ================= shared helpers ================= */
const S = { approved:{}, handledExtra:{} };
function chain(steps){
  return steps.map((s,i)=>{
    const root=s[2]?' root':''; const num=s[2]?'!':(i+1);
    const arr=i<steps.length-1?'<div class="carr">because ↓</div>':'';
    return `<div class="cstep${root}"><span class="cnum">${num}</span><div class="ct"><b>${s[0]}</b>${s[1]}</div></div>${arr}`;
  }).join('');
}
function ift(y,n){return `<div class="ift"><div class="yes"><b>If you OK now</b>${y}</div><div class="no"><b>If you wait</b>${n}</div></div>`;}
function cites(a){return a.map(c=>`<span class="cite">${c}</span>`).join('');}
function pillFor(k){return S.approved[k]?'<span class="pill pg">✓ Approved</span>':'<span class="pill po">Pending</span>';}

/* ================= sidebar ================= */
const NAV = [
  ['Command center', [['board', 'BD', 'Board — Global']]],
  ['Sales teams', [['nsales', 'NS', 'National Sales'], ['snorth', 'N', 'North'], ['ssouth', 'S', 'South'],
    ['swest', 'W', 'West'], ['seast', 'E', 'East & NE'], ['sexp', 'EX', 'Export']]],
  ['Plants & supply', [['ppune', 'PU', 'Pune Plant'], ['pchn', 'CH', 'Chennai Plant'], ['proc', 'PR', 'Procurement']]],
];
const NAV_MODULES = [
  ['Zoho modules', ['Sales (CRM)', 'Production (Creator)', 'Supply Chain (Creator)', 'Quality (Creator)', 'Support (Desk)']],
  ['Intelligence', ['Zia Agent', 'Analytics']],
];
function renderSide(){
  let h = '';
  for (const [sec, items] of NAV) {
    h += `<div class="sec">${sec}</div>`;
    for (const [r, av, label] of items) {
      const pend = ROLES[r].decisions.filter(k => !S.approved[k]).length;
      h += `<a class="${cur === r ? 'on' : ''}" href="#" onclick="render('${r}');return false">
            <span class="av2">${av}</span>${label}
            ${pend ? `<span class="badge">${pend}</span>` : '<span class="badge ok">✓</span>'}</a>`;
    }
  }
  for (const [sec, items] of NAV_MODULES) {
    h += `<div class="sec">${sec}</div>`;
    for (const label of items) h += `<a class="dead" href="#" onclick="return false"><span class="ic"></span>${label}</a>`;
  }
  document.getElementById('side').innerHTML = h;
}
function raceCard(){return `<details class="foldcard"><summary>Region race — North wins Q2 (107%); South &amp; East missed target <span class="src">CRM Region_Targets</span></summary>

/* ================= live data wiring + fallback ================= */
/* The bundled objects above are the demo-safe fallback. The dashboard normally
   renders from the API; if any part of the load fails we drop back to these so
   the demo never breaks. */
window.__FALLBACK__ = { ROLES: FALLBACK_ROLES, DEC: FALLBACK_DEC };
let ROLES = FALLBACK_ROLES;
let DEC = FALLBACK_DEC;

/* Build a render-ready DEC entry from an API decision (backtrack-plan §1 shape),
   reusing the existing chain()/cites()/ift() renderers. Falls back per-field. */
function hydrateDec(id, d){
  const fb = FALLBACK_DEC[id] || {};
  if(!d) return fb;
  const rawChain = d.chain || d.h_chain;
  let h = fb.h;
  if(Array.isArray(rawChain)){
    const steps = rawChain.map(s => Array.isArray(s) ? s : [s.dept, s.text, s.root]);
    const proof = d.cites || d.proof || [];
    h = ()=> chain(steps) + cites(proof) + ift(d.if_ok || '', d.if_wait || '');
  }
  return {
    sev:   d.sev || sevFromSeverity(d.severity) || fb.sev,
    title: d.title || fb.title,
    one:   d.one || d.one_liner || fb.one,
    owner: d.owner || (d.action && d.action.owner) || fb.owner,
    h:     h
  };
}

/* Build a render-ready ROLES entry from an API board, keeping the fallback's
   render function for main() unless the board ships pre-rendered mainHtml. */
function hydrateRole(role, b){
  const fb = FALLBACK_ROLES[role] || {};
  if(!b) return fb;
  return {
    av:        b.av || fb.av,
    crumb:     b.crumb || fb.crumb,
    title:     b.title || fb.title,
    sub:       b.sub || fb.sub,
    insight:   b.insight || fb.insight,
    kpis:      b.kpis || fb.kpis,
    main:      (typeof b.mainHtml === 'string') ? (()=>b.mainHtml) : fb.main,
    decisions: b.decisions || fb.decisions,
    statuses:  b.statuses || fb.statuses,
    handled:   b.handled || fb.handled,
    hints:     b.hints || fb.hints
  };
}

function applyBoards(boards){
  const roles = {};
  const dec = Object.assign({}, FALLBACK_DEC);
  for(const r of ALL_ROLES){
    const b = boards[r];
    roles[r] = hydrateRole(r, b);
    if(b && b.dec){ for(const id in b.dec) dec[id] = hydrateDec(id, b.dec[id]); }
  }
  ROLES = roles;
  DEC = dec;
}

async function loadBoards(){
  const results = await Promise.all(ALL_ROLES.map(async r=>{
    const res = await fetch(`${API_BASE}/api/board?role=${encodeURIComponent(r)}`, { headers:{ Accept:'application/json' } });
    if(!res.ok) throw new Error(`GET /api/board?role=${r} -> ${res.status}`);
    const data = await res.json();
    return [r, (data && data.board) ? data.board : data];
  }));
  const boards = {};
  for(const [r,b] of results) boards[r] = b;
  return boards;
}

async function bootstrap(){
  try{
    applyBoards(await loadBoards());
  }catch(err){
    console.warn('GlassOps: live board load failed — using bundled fallback data.', err);
    ROLES = window.__FALLBACK__.ROLES;
    DEC = window.__FALLBACK__.DEC;
  }
  render('board');
}

/* ================= rendering ================= */
let cur='board';
function render(role){
  cur=role; const R=ROLES[role];
  const av=document.getElementById('av'); if(av) av.textContent=R.av;
  document.getElementById('main').innerHTML =
    `<section class="hero">
       <div class="crumb">Home / ${R.crumb}</div>
       <div class="head"><div><h1>${R.title}</h1><div class="sub">${R.sub}</div></div>
         <div class="hero-right">${R.kpis.slice(0,4).map(k=>`<div class="mini-stat"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div></div>
       <div class="banner"><div class="tag">Headline</div><div>${R.insight}</div></div>
     </section>
     <section class="kpis">${R.kpis.map(k=>`<div class="kpi ${k[4]||''}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d ${k[3]}">${k[2]}</div></div>`).join('')}</section>
     ${R.main()}`;
  renderAgent();
}
function renderAgent(){
  renderSide();
  const R=ROLES[cur];
  const pend=R.decisions.filter(k=>!S.approved[k]).length;
  const chip = pend? `${pend} open` : 'All clear ✓';
  let acts='';
  R.decisions.forEach((k,i)=>{
    const d=DEC[k]; const done=S.approved[k];
    acts+=`<article class="action${done?' done':''}">
      <div class="arow"><div class="anum">${done?'✓':i+1}</div>
        <div class="abody2"><b>${d.title}</b><span>Owner: ${d.owner} · ${d.one}</span></div></div>
      <div class="dbtns"><button class="mini" onclick="showDec('${k}')">Why?</button>
        <button class="mini ok" ${done?'disabled':''} onclick="okDec('${k}',this)">${done?'✓ Approved':'OK — do it'}</button></div>
    </article>`;
  });
  let stat='';
  if(R.statuses.length){
    stat=`<div class="seclabel2 mt">Being handled elsewhere</div>`+
      R.statuses.map(([k,label])=>`<div class="statusline" data-status="${k}">${pillFor(k)}<span>${label}</span></div>`).join('');
  }
  const extra=(S.handledExtra[cur]||[]);
  const handled=`<details class="handled"><summary>Handled by the agent — ${R.handled.length+extra.length} ✓</summary>`+
    extra.concat(R.handled).map(x=>`<div class="hitem"><span class="ok">✓</span><span>${x}</span></div>`).join('')+`</details>`;
  const inner=`
    <div class="ahead"><div class="zicon">Z</div>
      <div><div class="atitle">Zia Agent</div><div class="asub">Morning brief · ${R.crumb}</div></div>
      <span class="chip">${chip}</span>
      <button class="closeX" onclick="closePanel()" aria-label="Close">×</button></div>
    <div class="abody">
      <div class="seclabel2">${pend?'Needs your OK':'Recommended by the agent'}</div>
      ${acts||`<div class="allclear">Nothing needs your OK today. The agent is watching the small signals for you.</div>`}
      <div class="detail" id="detail"></div>
      ${stat}
      ${handled}
    </div>
    <div class="ask"><div class="askrow"><input id="ask" placeholder="Ask about your area, product, region or risk" onkeydown="if(event.key==='Enter')freeAsk()"><button onclick="freeAsk()">Ask</button></div><div class="hint" id="hints"></div></div>`;
  document.getElementById('agent').innerHTML=inner;
  const tog=document.getElementById('togCount'); if(tog) tog.textContent = pend? `· ${pend}`:'';
  document.getElementById('hints').innerHTML='Try: '+R.hints.map(x=>`<b onclick="showDec('${x[1]}');document.getElementById('ask').value='${x[0]}'">${x[0]}</b>`).join(' · ');
  if(R.decisions.length) showDec(R.decisions[0]);
}
function showDec(k){
  const d=DEC[k]; if(!d)return;
  const btn = S.approved[k]
    ? `<button class="act done" disabled>✓ Approved — teams notified</button>`
    : (ROLES[cur].decisions.includes(k)
        ? `<button class="act" onclick="okDec('${k}',this)">OK — do it</button>`
        : `<button class="act" style="background:rgba(255,255,255,.08);color:var(--muted)" disabled>Owner: ${d.owner}</button>`);
  const el=document.getElementById('detail'); if(!el)return;
  el.innerHTML =
    `<div class="dt"><span class="sev ${d.sev}">${d.sev==='r'?'URGENT':d.sev==='a'?'ATTENTION':'OPPORTUNITY'}</span>${d.title}</div>${d.h()}${btn}`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function okDec(k,btn){
  S.approved[k]=true;
  (S.handledExtra[cur]=S.handledExtra[cur]||[]).unshift(`Approved: ${DEC[k].title} — owner & teams notified in Cliq, task created in Projects`);
  document.querySelectorAll(`[data-status="${k}"]`).forEach(el=>{ if(el.tagName==='TD'||el.classList.contains('statusline')) el.querySelector('.pill') ? el.querySelector('.pill').outerHTML=pillFor(k) : el.innerHTML=pillFor(k); });
  renderAgent();
}
function freeAsk(){
  const inp=document.getElementById('ask'); const v=(inp?inp.value:'').toLowerCase();
  const R=ROLES[cur];
  const hit=R.hints.find(h=>v.includes(h[0].split(' ')[2]||'zzz')) || null;
  if(v.includes('biggest')||v.includes('risk')||v.includes('problem')) showDec(R.decisions[0]);
  else if(hit) showDec(hit[1]);
  else if(v.trim()){ const el=document.getElementById('detail'); if(el) el.innerHTML =
    `<div class="dt"><span class="sev a">LIVE</span>Live agent call</div>In the real build this goes to the Zia agent on Catalyst with your role, region/plant and current filters as context — it reads CRM + Creator + Desk and answers here with a why-chain and proof records. This demo has wired answers for the questions under the ask box and every decision.`; }
}
/* ===== agent panel move (own column ⇄ overlay, never overlaps) ===== */
function openPanel(){ document.getElementById('agentOverlay').appendChild(document.getElementById('agent')); document.getElementById('agentOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closePanel(){ document.getElementById('contentWrap').appendChild(document.getElementById('agent')); document.getElementById('agentOverlay').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('agentOverlay').classList.contains('open')) closePanel(); });
window.addEventListener('resize',()=>{ if(window.innerWidth>1150 && document.getElementById('agentOverlay').classList.contains('open')) closePanel(); });

/* Load live board data from /api, then render (falls back to bundled data on failure). */
bootstrap();
</script>
